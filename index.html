,hl:"arm.T.x",sym:"x",lbl:"Afstand bolt–ben",unit:"mm",type:"num",minEx:0,show:At,tip:"Afstand fra bolt til ben i bøjlens plan. Programmet bruger den virkelige afstand √(x² + e²), hvor e = d/2 + ⌀/2 + 2 er bøjlens forskydning fri af skaftet. Kun ben ≤ 0,75·h<sub>ef</sub> fra ankeret er virksomme.",ref:"EN 1992-4, 7.2.1.2(2)c"},{k:"beton.armering.ankerarmeringTraek.daeklagTop",hl:"arm.T.top",sym:"c<sub>top</sub>",lbl:"Dæklag til benets top",unit:"mm",type:"num",min:0,show:At,tip:"Afstand fra betonoverflade til benets øverste forankringspunkt. Bestemmer l<sub>1</sub> i brudkeglen.",ref:"EN 1992-4, (7.33), Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.krog",hl:"arm.T.krog",sym:"",lbl:"Bøjle med bøjning ved overfladen (ellers lige stænger)",type:"switch",show:At,tip:"Til: bøjle med den lukkede ende ved den belastede overflade om overfladearmeringen – l<sub>1</sub> ≥ 4⌀. Fra: rette, lodrette stænger parvis om ankeret med lige ender i keglen – l<sub>1</sub> ≥ 10⌀; ingen overfladestænger tegnes, da stængerne ikke omslutter dem.",ref:"EN 1992-4, 7.2.1.2(2)d"},{k:"beton.armering.ankerarmeringTraek.cd",hl:"arm.T.cd",sym:"c<sub>d</sub>",lbl:"c<sub>d</sub> for α<sub>1</sub>",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"α₁ = 1,0",show:t=>At()&&t.beton.armering.ankerarmeringTraek.krog,tip:"Mindste af sidedæklag og halv fri afstand til nabostang, vinkelret på bøjningens plan (EN 1992-1-1, Fig. 8.3). α<sub>1</sub> = 0,7 når c<sub>d</sub> > 3⌀. Tomt: α<sub>1</sub> = 1,0 (på den sikre side).",ref:"EN 1992-1-1, 8.4.4"},{k:"beton.armering.ankerarmeringTraek.foering",hl:"arm.T.foering",sym:"",lbl:"Trækket føres videre",type:"select",options:[["stoed","Ved stød i elementets armering"],["ingen","Nej – kegle ved armeringens ende"]],show:At,tip:"Ankerarmeringen skal forankres uden for keglen. Føres trækket ikke over i elementets armering med et stød, skal betonkeglebrud ved armeringens ende eftervises (7.2.1.2(2)e).",ref:"EN 1992-4, 7.2.1.2 (2) e"},{k:"beton.armering.ankerarmeringTraek.forankringsdybde",hl:"arm.T.dybde",sym:"h'<sub>ef,re</sub>",lbl:"Armeringens forankringsdybde",unit:"mm",type:"num",minEx:0,nullable:!0,std:t=>En(t.anker.hef),show:t=>At()&&t.beton.armering.ankerarmeringTraek.foering==="ingen",tip:"Dybde til armeringens ende/bøjning. Bruges til betonkeglebrud ved armeringens ende (N<sub>cre</sub>). Tomt = ankerets h<sub>ef</sub> (konservativt).",ref:"EN 1992-4, 7.2.1.2 (2) e / (7.1)"},{k:"beton.armering.ankerarmeringTraek.eta1",hl:"arm.T.eta1",sym:"η<sub>1</sub>",lbl:"Vedhæftningsforhold",type:"select",num:!0,options:[[1,"Gode (1,0)"],[.7,"Andre (0,7)"]],show:At,tip:"η<sub>1</sub> i f<sub>bd</sub>.",ref:"EN 1992-1-1, 8.4.2"},{k:"beton.armering.ankerarmeringTraek.drejet",hl:"arm.T.drejet",sym:"",lbl:"Drej bøjleparrene 90°",type:"switch",show:At,tip:"Bøjleparrenes plan ligger som standard langs x; slået til drejes de 90° om ankeret (langs y). Påvirker kun tegningen – beregningen er uafhængig af retningen, da benene ligger symmetrisk om ankeret.",ref:"EN 1992-4, Fig. 7.2"},{sub:"Forudsætninger for ankerarmering i træk (7.2.1.2(2))",show:At},{k:"beton.armering.ankerarmeringTraek.bekraeft.a",hl:"arm.T.bekr.a",sym:"a",lbl:"a) Ribbestål som bøjler/løkker er kontrolleret",type:"switch",show:At,tip:"Programmet kontrollerer ⌀ ≤ 16 mm og f<sub>yk,re</sub> ≤ 600 MPa. Bekræft her, at armeringen er ribbestål udformet som bøjler eller løkker, og at de øvrige krav i a) er opfyldt (se normteksten).",ref:"EN 1992-4, 7.2.1.2(2)a"},{k:"beton.armering.ankerarmeringTraek.bekraeft.e",hl:"arm.T.bekr.e",sym:"e",lbl:"e) Trækket føres videre med stød i elementets armering",type:"switch",show:t=>At()&&t.beton.armering.ankerarmeringTraek.foering==="stoed",tip:'Gælder, når trækket føres videre ved et stød: bekræft, at ankerarmeringen er forankret/stødt uden for brudkeglen i elementets armering. Vælges i stedet "Nej – kegle ved armeringens ende", eftervises betonkeglen ved armeringens ende af programmet, og feltet er unødvendigt.',ref:"EN 1992-4, 7.2.1.2(2)e"},{k:"beton.armering.ankerarmeringTraek.bekraeft.f",hl:"arm.T.bekr.f",sym:"f",lbl:"f) Betingelse f) er kontrolleret",type:"switch",show:At,tip:"Programmet kender ikke ordlyden af betingelse f) (normteksten ligger ikke i kodelageret). Slå op i EN 1992-4, 7.2.1.2(2)f og bekræft her, når den er opfyldt. Bekræftelsen noteres i rapportens bemærkninger.",ref:"EN 1992-4, 7.2.1.2(2)f"},{custom:"armsum",which:"T",show:At},{sub:"Ankerarmering for forskydning"},{k:"beton.armering.ankerarmeringForskydning.aktiv",hl:"arm.V",sym:"",lbl:"Ankerarmering for forskydning",type:"switch",tip:"Armering der optager hele forskydningskraften og erstatter betonkantbrud mod den valgte kant (7.2.2.2(1)). Skal forankres uden for brudlegemet med l<sub>bd</sub> efter EN 1992-1-1 (7.2.2.2(2)) – det eftervises ikke af programmet.",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.kant",hl:"arm.V.kant",sym:"",lbl:"Kant der armeres",type:"select",nullable:!0,options:[["","Styrende kant"],["xNeg","Kant x−"],["xPos","Kant x+"],["yNeg","Kant y−"],["yPos","Kant y+"]],show:Qt,tip:'Forskydningsarmeringen erstatter kun kantbrud mod denne ene kant. Øvrige kanter eftervises fortsat for kantbrud. "Styrende kant" = den kant, der er mest udnyttet uden armering.',ref:"EN 1992-4, 7.2.2.6 / QS-02"},{k:"beton.armering.ankerarmeringForskydning.type",hl:"arm.V.type",sym:"k<sub>10</sub>",lbl:"Udformning",type:"select",options:[["overflade","Overfladearmering – Fig. 7.10 a) (1,0)"],["boejle","Bøjle om forreste række – Fig. 7.10 b) (0,5)"],["loekke","Løkke om hvert anker – Fig. 7.10 c) (0,5)"]],show:Qt,tip:"EN 1992-4, Figur 7.10. a) Overfladearmering: rette stænger vinkelret på kanten, inden for 0,75·c<sub>1</sub> på hver side af bolten, plus armering langs kanten (k<sub>10</sub> = 1,0). b) Bøjle: én bøjle om hele forreste række, lukket side an mod skafterne på kantsiden, benene uden om befæstelsen. c) Løkker: én løkke om hvert anker i forreste række, an mod skaftet. Benene føres ind i elementet (k<sub>10</sub> = 0,5).",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.diameter",hl:"arm.V.d",sym:"⌀",lbl:"Stangdiameter",unit:"mm",type:"num",min:6,max:16,show:Qt,tip:"Ribbestål, f<sub>yk</sub> ≤ 600 MPa. For overfladearmering (Fig. 7.10 a) også ⌀ ≤ 16 mm; for bøjler/løkker holder programmet samme grænse.",ref:"EN 1992-4, 7.2.2.2(3)b, 7.2.2.6.2"},{k:"beton.armering.ankerarmeringForskydning.benPrAnker",hl:"arm.V.n",sym:"n",lbl:"Ben pr. anker (forreste række)",unit:"stk",type:"num",min:1,max:12,int:!0,show:t=>Qt()&&t.beton.armering.ankerarmeringForskydning.type==="overflade",tip:"Antal rette stænger pr. anker i forreste række (skiftevis på hver side af bolten).",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.antalLoekker",hl:"arm.V.n",sym:"n<sub>l</sub>",lbl:"Antal løkker pr. anker",unit:"stk",type:"num",min:1,max:6,int:!0,nullable:!0,std:t=>String(Math.max(1,Math.ceil((t.beton.armering.ankerarmeringForskydning.benPrAnker??2)/2))),show:t=>Qt()&&t.beton.armering.ankerarmeringForskydning.type==="loekke",tip:"Fig. 7.10 c): én løkke om hvert anker i forreste række. Den runde ende ligger an mod skaftet på kantsiden, og de 2 ben føres ind i elementet. n = 2·n<sub>l</sub> ben pr. anker. Flere løkker lægges under hinanden.",ref:"EN 1992-4, Fig. 7.10 c), 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.antalBoejler",hl:"arm.V.n",sym:"n<sub>b</sub>",lbl:"Antal bøjler om forreste række",unit:"stk",type:"num",min:1,max:6,int:!0,nullable:!0,std:()=>"efter ben pr. anker",show:t=>Qt()&&t.beton.armering.ankerarmeringForskydning.type==="boejle",tip:"Fig. 7.10 b): én bøjle om hele forreste række. Den lukkede side ligger an mod skafterne på kantsiden, og de 2 ben føres uden om befæstelsen ind i elementet. Benene deles af rækkens ankre: n = 2·n<sub>b</sub>/n<sub>F</sub> ben pr. anker. Flere bøjler lægges under hinanden.",ref:"EN 1992-4, Fig. 7.10 b), 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.fyk",hl:"arm.V.fyk",sym:"f<sub>yk,re</s :root{--ink:#14202a;--ink2:#4a5863;--ink3:#7b8791;--rule:#d5dbe0;--rule2:#e8ecef;--accent:#1b5fd0;--ok:#1b7a3d;--okbg:#e6f4ea;--warn:#a15c00;--warnbg:#fdf1dc;--bad:#b42318;--badbg:#fbe9e7}
*{box-sizing:border-box}
html{background:#e7eaec}
body{margin:0;font:10pt/1.42 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.side{max-width:210mm;margin:16px auto;background:#fff;padding:18mm 16mm 16mm;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.vaerktoej{max-width:210mm;margin:12px auto 0;display:flex;justify-content:flex-end;gap:8px}
.vaerktoej button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid #1a2228;background:#1a2228;color:#fff;cursor:pointer}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12mm;border-bottom:2px solid var(--ink);padding-bottom:5pt}
h1{font-size:18pt;line-height:1.2;margin:0;font-weight:650}
.norm{color:var(--ink2);font-size:9.5pt;margin-top:2pt}
.build{color:var(--ink3);font-size:8.5pt;text-align:right;white-space:nowrap}
h2{font-size:12.5pt;margin:20pt 0 6pt;padding-bottom:2pt;border-bottom:1px solid var(--ink);font-weight:650;break-after:avoid}
h3{font-size:10.5pt;margin:12pt 0 3pt;font-weight:650;break-after:avoid}
h3.fl{display:flex;justify-content:space-between;align-items:baseline;gap:10pt}
h3 .u{font-variant-numeric:tabular-nums}
h3 small{font-weight:400;color:var(--ink3);font-size:8.5pt}
table{border-collapse:collapse;width:100%;margin:3pt 0 6pt;font-size:9pt}
th,td{padding:2.2pt 5pt;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink3);border-bottom:1px solid var(--rule)}
thead th{font-size:8.5pt}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr{break-inside:avoid}
.meta{width:100%;margin:8pt 0 0;table-layout:fixed}.meta th{width:17%;white-space:nowrap}.meta td{width:33%}
.urgent{font-weight:700}
.dom{display:flex;gap:10pt;align-items:center;margin:10pt 0 4pt;padding:8pt 11pt;border-radius:4pt;border-left:5pt solid}
.dom.ok{background:var(--okbg);border-color:var(--ok)}.dom.bad{background:var(--badbg);border-color:var(--bad)}
.dom .stor{font-size:15pt;font-weight:750;letter-spacing:.02em;white-space:nowrap}.dom.ok .stor{color:var(--ok)}.dom.bad .stor{color:var(--bad)}
.dom .tekst{flex:1}.dom .tekst b{font-weight:650}
.note{margin:6pt 0;padding:5pt 9pt;background:var(--warnbg);font-size:9pt;border-radius:3pt}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.na{color:var(--ink3)}
