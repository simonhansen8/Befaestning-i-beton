,type:"num",min:0,show:Jt,tip:"Afstand fra betonoverflade til benets øverste forankringspunkt. Bestemmer l<sub>1</sub> i brudkeglen.",ref:"EN 1992-4, (7.33), Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.krog",hl:"arm.T.krog",sym:"",lbl:"Bøjle med bøjning ved overfladen (ellers lige stænger)",type:"switch",show:Jt,tip:"Til: bøjle med den lukkede ende ved den belastede overflade om overfladearmeringen – l<sub>1</sub> ≥ 4⌀. Fra: rette, lodrette stænger parvis om ankeret med lige ender i keglen – l<sub>1</sub> ≥ 10⌀; ingen overfladestænger tegnes, da stængerne ikke omslutter dem.",ref:"EN 1992-4, 7.2.1.2(2)d"},{k:"beton.armering.ankerarmeringTraek.cd",hl:"arm.T.cd",sym:"c<sub>d</sub>",lbl:"c<sub>d</sub> for α<sub>1</sub>",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"α₁ = 1,0",show:n=>Jt(n)&&n.beton.armering.ankerarmeringTraek.krog,tip:"Mindste af sidedæklag og halv fri afstand til nabostang, vinkelret på bøjningens plan (EN 1992-1-1, Fig. 8.3). α<sub>1</sub> = 0,7 når c<sub>d</sub> > 3⌀. Tomt: α<sub>1</sub> = 1,0 (på den sikre side).",ref:"EN 1992-1-1, 8.4.4"},{k:"beton.armering.ankerarmeringTraek.foering",hl:"arm.T.foering",sym:"",lbl:"Trækket føres videre",type:"select",options:[["stoed","Ved stød i elementets armering"],["ingen","Nej – kegle ved armeringens ende"]],show:Jt,tip:"Ankerarmeringen skal forankres uden for keglen. Føres trækket ikke over i elementets armering med et stød, skal betonkeglebrud ved armeringens ende eftervises (7.2.1.2(2)e).",ref:"EN 1992-4, 7.2.1.2 (2) e"},{k:"beton.armering.ankerarmeringTraek.forankringsdybde",hl:"arm.T.dybde",sym:"h'<sub>ef,re</sub>",lbl:"Armeringens forankringsdybde",unit:"mm",type:"num",minEx:0,nullable:!0,std:n=>Rn(n.anker.hef),show:n=>Jt(n)&&n.beton.armering.ankerarmeringTraek.foering==="ingen",tip:"Dybde til armeringens ende/bøjning. Bruges til betonkeglebrud ved armeringens ende (N<sub>cre</sub>). Tomt = ankerets h<sub>ef</sub> (konservativt).",ref:"EN 1992-4, 7.2.1.2 (2) e / (7.1)"},{k:"beton.armering.ankerarmeringTraek.eta1",hl:"arm.T.eta1",sym:"η<sub>1</sub>",lbl:"Vedhæftningsforhold",type:"select",num:!0,options:[[1,"Gode (1,0)"],[.7,"Andre (0,7)"]],show:Jt,tip:"η<sub>1</sub> i f<sub>bd</sub>.",ref:"EN 1992-1-1, 8.4.2"},{custom:"armsum",which:"T",show:Jt},{sub:"Ankerarmering for forskydning"},{k:"beton.armering.ankerarmeringForskydning.aktiv",hl:"arm.V",sym:"",lbl:"Ankerarmering for forskydning",type:"switch",tip:"Armering der optager hele forskydningskraften og erstatter betonkantbrud mod den valgte kant (7.2.2.2(1)). Skal forankres uden for brudlegemet med l<sub>bd</sub> efter EN 1992-1-1 (7.2.2.2(2)) – det eftervises ikke af programmet.",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.kant",hl:"arm.V.kant",sym:"",lbl:"Kant der armeres",type:"select",nullable:!0,options:[["","Styrende kant"],["xNeg","Kant x−"],["xPos","Kant x+"],["yNeg","Kant y−"],["yPos","Kant y+"]],show:rn,tip:'Forskydningsarmeringen erstatter kun kantbrud mod denne ene kant. Øvrige kanter eftervises fortsat for kantbrud. "Styrende kant" = den kant, der er mest udnyttet uden armering.',ref:"EN 1992-4, 7.2.2.6 / QS-02"},{k:"beton.armering.ankerarmeringForskydning.type",hl:"arm.V.type",sym:"k<sub>10</sub>",lbl:"Udformning",type:"select",options:[["overflade","Overfladearmering – Fig. 7.10 a) (1,0)"],["boejle","Bøjle om forreste række – Fig. 7.10 b) (0,5)"],["loekke","Løkke om hvert anker – Fig. 7.10 c) (0,5)"]],show:rn,tip:"EN 1992-4, Figur 7.10. a) Overfladearmering: rette stænger vinkelret på kanten, inden for 0,75·c<sub>1</sub> på hver side af bolten, plus armering langs kanten (k<sub>10</sub> = 1,0). b) Bøjle: én bøjle om hele forreste række, lukket side an mod skafterne på kantsiden, benene uden om befæstelsen. c) Løkker: én løkke om hvert anker i forreste række, an mod skaftet. Benene føres ind i elementet (k<sub>10</sub> = 0,5).",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.diameter",hl:"arm.V.d",sym:"⌀",lbl:"Stangdiameter",unit:"mm",type:"num",m .6"},{k:"beton.armering.ankerarmeringForskydning.afstand",hl:"arm.V.x",sym:"x",lbl:"Afstand bolt–ben",unit:"mm",type:"num",minEx:0,show:Zi,tip:"Kun overfladearmering: afstand fra bolt til stang. Kun stænger inden for 0,75·c<sub>1</sub> regnes virksomme (vises grå ellers). Bøjler og løkker ligger an mod skaftet.",ref:"EN 1992-4, 7.2.2.2(3)c"},{k:"beton.armering.ankerarmeringForskydning.daekToAkse",hl:"arm.V.z",sym:"z<sub>s</sub>",lbl:"Dybde til stangakse",unit:"mm",type:"num",minEx:0,show:rn,tip:"Dybde fra betonoverflade til stangens akse. Indgår i e<sub>s</sub> og (for overfladearmering) i l<sub>1</sub>.",ref:"EN 1992-4, 6.4.3(1)"},{k:"beton.armering.ankerarmeringForskydning.es",hl:"arm.V.es",sym:"e<sub>s</sub>",lbl:"Afstand last–stangakse",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"e + t + z<sub>s</sub>",show:rn,tip:"Afstand fra forskydningskraftens linje på fodpladen til armeringens akse (Fig. 6.8). Tomt: e + t + z<sub>s</sub> (last i overkant plade). Angiv større værdi, hvis lasten angriber over pladen.",ref:"EN 1992-4, 6.4.3(1)"},{k:"beton.armering.ankerarmeringForskydning.cd",hl:"arm.V.cd",sym:"c<sub>d</sub>",lbl:"c<sub>d</sub> for α<sub>1</sub>",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"α₁ = 1,0",show:n=>Zi(n)&&n.beton.armering.ankerarmeringForskydning.krog,tip:"Mindste af sidedæklag og halv fri afstand til nabostang, vinkelret på bøjningens plan (EN 1992-1-1, Fig. 8.3). α<sub>1</sub> = 0,7 når c<sub>d</sub> > 3⌀. Tomt: α<sub>1</sub> = 1,0.",ref:"EN 1992-1-1, 8.4.4"},{k:"beton.armering.ankerarmeringForskydning.l1",hl:"arm.V.l1",sym:"l<sub>1</sub>",lbl:"Forankring i brudprismet",unit:"mm",type:"num",minEx:0,nullable:!0,std:()=>"beregnet",show:Zi,tip:"Tomt = beregnet: l<sub>1</sub> = c<sub>1</sub> − x/1,5 − c<sub>nom</sub> (anbefalet). En større indtastet værdi beskæres af kernen. Krav: bøjle ≥ 4⌀, lige ≥ 10⌀.",ref:"EN 1992-4, 7.2.2.6 / QF-09"},{k:"beton.armering.ankerarmeringForskydning.eta1",hl:"arm.V.eta1",sym:"η<sub>1</sub>",lbl:"Vedhæftningsforho
