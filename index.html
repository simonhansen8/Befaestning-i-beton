4. Ellers 1,0.",ref:"EN 1992-4, 7.2.2.5 (9)"},{k:"beton.armering.splitArmering",hl:"arm.split",sym:"",lbl:"Revnebegr\xE6nsende armering (spaltning)",type:"switch",tip:"Armering der begr\xE6nser revnevidden til w<sub>k</sub> \u2264 0,3 mm \u2013 spaltning kan da udelades i revnet beton.",ref:"EN 1992-4, 7.2.1.7 (2) b"},{sub:"Ankerarmering for tr\xE6k"},{k:"beton.armering.ankerarmeringTraek.aktiv",hl:"arm.T",sym:"",lbl:"Ankerarmering for tr\xE6k",type:"switch",tip:"Armering der optager tr\xE6kkraften og erstatter betonkeglebrud. Skal v\xE6re forankret p\xE5 begge sider af brudkeglen, inden for 0,75\xB7h<sub>ef</sub> fra bolten.",ref:"EN 1992-4, 7.2.1.9"},{k:"beton.armering.ankerarmeringTraek.diameter",hl:"arm.T.d",sym:"\u2300",lbl:"Stangdiameter",unit:"mm",type:"num",min:6,max:16,show:Ei,tip:"Ribbest\xE5l, \u2300 \u2264 16 mm og f<sub>yk,re</sub> \u2264 600 MPa, udformet som b\xF8jler eller l\xF8kker.",ref:"EN 1992-4, 7.2.1.2(2)a"},{k:"beton.armering.ankerarmeringTraek.antalBoejler",hl:"arm.T.n",sym:"n<sub>b</sub>",lbl:"Antal b\xF8jler (stangpar) pr. anker",unit:"stk",type:"num",min:1,max:6,int:!0,show:Ei,tip:"Fig. 7.2: armeringen ligger parvis og symmetrisk om ankeret \u2013 som b\xF8jler med b\xF8jning ved overfladen, eller som par af lige st\xE6nger. n = 2\xB7n<sub>b</sub> ben pr. anker krydser brudkeglen. Flere b\xF8jler drejes om ankeret og l\xE6gges \u2300 + 1 mm under hinanden, s\xE5 de ikke krydser i samme h\xF8jde.",ref:"EN 1992-4, 7.2.1.2(2)a, 7.2.1.9"},{k:"beton.armering.ankerarmeringTraek.fyk",hl:"arm.T.fyk",sym:"f<sub>yk,re</sub>",lbl:"Flydesp\xE6nding",unit:"MPa",type:"num",min:200,max:600,show:Ei,tip:"Karakteristisk flydesp\xE6nding for armeringen, h\xF8jst 600 MPa.",ref:"EN 1992-4, 7.2.1.9"},{k:"beton.armering.ankerarmeringTraek.afstand",hl:"arm.T.x",sym:"x",lbl:"Afstand bolt\u2013ben",unit:"mm",type:"num",minEx:0,show:Ei,tip:"Afstand fra bolt til ben i b\xF8jlens plan. Programmet bruger den virkelige afstand \u221A(x\xB2 + e\xB2), hvor e = d/2 + \u2300/2 + 2 er b\xF8jlens forskydning fri af skaftet. Kun ben \u2264 0,75\xB7h<sub>ef</sub> fra ankeret er virksomme.",ref:"EN 1992-4, 7.2.1.2(2)c"},{k:"beton.armering.ankerarmeringTraek.daeklagTop",hl:"arm.T.top",sym:"c<sub>top</sub>",lbl:"D\xE6klag til benets top",unit:"mm",type:"num",min:0,show:Ei,tip:"Afstand fra betonoverflade til benets \xF8verste forankringspunkt. Bestemmer l<sub>1</sub> i brudkeglen.",ref:"EN 1992-4, (7.33), Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.krog",hl:"arm.T.krog",sym:"",lbl:"B\xF8jle med b\xF8jning ved overfladen (ellers lige st\xE6nger)",type:"switch",show:Ei,tip:"Til: b\xF8jle med den lukkede ende ved den belastede overflade om overfladearmeringen \u2013 l<sub>1</sub> \u2265 4\u2300. Fra: rette, lodrette st\xE6nger parvis om ankeret med lige ender i keglen \u2013 l<sub>1</sub> \u2265 10\u2300; ingen overfladest\xE6nger tegnes, da st\xE6ngerne ikke omslutter dem.",ref:"EN 1992-4, 7.2.1.2(2)d"},{k:"beton.armering.ankerarmeringTraek.cd",hl:"arm.T.cd",sym:"c<sub>d</sub>",lbl:"c<sub>d</sub> for \u03B1<sub>1</sub>",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"\u03B1\u2081 = 1,0",show:n=>Ei(n)&&n.beton.armering.ankerarmeringTraek.krog,tip:"Mindste af sided\xE6klag og halv fri afstand til nabostang, vinkelret p\xE5 b\xF8jningens plan (EN 1992-1-1, Fig. 8.3). \u03B1<sub>1</sub> = 0,7 n\xE5r c<sub>d</sub> > 3\u2300. Tomt: \u03B1<sub>1</sub> = 1,0 (p\xE5 den sikre side).",ref:"EN 1992-1-1, 8.4.4"},{k:"beton.armering.ankerarmeringTraek.foering",hl:"arm.T.foering",sym:"",lbl:"Tr\xE6kket f\xF8res videre",type:"select",options:[["stoed","Ved st\xF8d i elementets armering"],["ingen","Nej \u2013 kegle ved armeringens ende"]],show:Ei,tip:"Ankerarmeringen skal forankres uden for keglen. F\xF8res tr\xE6kket ikke over i elementets armering med et st\xF8d, skal betonkeglebrud ved armeringens ende eftervises (7.2.1.2(2)e).",ref:"EN 1992-4, 7.2.1.2 (2) e"},{k:"beton.armering.ankerarmeringTraek.forankringsdybde",hl:"arm.T.dybde",sym:"h'<sub>ef,re</sub>",lbl:"Armeringens forankringsdybde",unit:"mm",type:"num",minEx:0,nullable:!0,std:n=>Qi(n.anker.hef),show:n=>Ei(n)&&n.beton.armering.ankerarmeringTraek.foering==="ingen",tip:"Dybde til armeringens ende/b\xF8jning. Bruges til betonkeglebrud ved armeringens ende (N<sub>cre</sub>). Tomt = ankerets h<sub>ef</sub> (konservativt).",ref:"EN 1992-4, 7.2.1.2 (2) e / (7.1)"},{k:"beton.armering.ankerarmeringTraek.eta1",hl:"arm.T.eta1",sym:"\u03B7<sub>1</sub>",lbl:"Vedh\xE6ftningsforhold",type:"select",num:!0,options:[[1,"Gode (1,0)"],[.7,"Andre (0,7)"]],show:Ei,tip:"\u03B7<sub>1</sub> i f<sub>bd</sub>.",ref:"EN 1992-1-1, 8.4.2"},{sub:"Ankerarmering for forskydning"},{k:"beton.armering.ankerarmeringForskydning.aktiv",hl:"arm.V",sym:"",lbl:"Ankerarmering for forskydning",type:"switch",tip:"Armering der optager hele forskydningskraften og erstatter betonkantbrud mod den valgte kant (7.2.2.2(1)). Skal forankres uden for brudlegemet med l<sub>bd</sub> efter EN 1992-1-1 (7.2.2.2(2)) \u2013 det eftervises ikke af programmet.",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.kant",hl:"arm.V.kant",sym:"",lbl:"Kant der armeres",type:"select",nullable:!0,options:[["","Styrende kant"],["xNeg","Kant x\u2212"],["xPos","Kant x+"],["yNeg","Kant y\u2212"],["yPos","Kant y+"]],show:Si,tip:'Forskydningsarmeringen erstatter kun kantbrud mod denne ene kant. \xD8vrige kanter eftervises fortsat for kantbrud. "Styrende kant" = den kant, der er mest udnyttet uden armering.',ref:"EN 1992-4, 7.2.2.6 / QS-02"},{k:"beton.armering.ankerarmeringForskydning.type",hl:"arm.V.type",sym:"k<sub>10</sub>",lbl:"Udformning",type:"select",options:[["overflade","Overfladearmering \u2013 Fig. 7.10 a) (1,0)"],["boejle","B\xF8jle om forreste r\xE6kke \u2013 Fig. 7.10 b) (0,5)"],["loekke","L\xF8kke om hvert anker \u2013 Fig. 7.10 c) (0,5)"]],show:Si,tip:"EN 1992-4, Figur 7.10. a) Overfladearmering: rette st\xE6nger vinkelret p\xE5 kanten, inden for 0,75\xB7c<sub>1</sub> p\xE5 hver side af bolten, plu
