 (1,0)"],["boejler","Kantstang + bøjler (1,4)"]],disabled:t=>t.beton.revnet?null:"Ingen effekt i urevnet beton: ψ<sub>re,V</sub> = 1,0.",tip:"Rette kantstænger uden bøjler giver 1,0 i EN 1992-4:2018 (1,2 var CEN/TS). Kun i revnet beton: kantstang med bøjler eller net, a ≤ 100 mm og a ≤ 2c<sub>1</sub> giver ψ<sub>re,V</sub> = 1,4. Ellers 1,0.",ref:"EN 1992-4, 7.2.2.5"},{k:"beton.armering.kantarmeringAfstand",hl:"arm.kant",sym:"a",lbl:"Bøjleafstand (kantarmering)",unit:"mm",type:"num",min:0,nullable:!0,show:t=>t.beton.revnet&&t.beton.armering.kantarmering==="boejler",tip:"Afstand mellem bøjler/net langs kanten. ψ<sub>re,V</sub> = 1,4 kræver a ≤ 100 mm og a ≤ 2c<sub>1</sub>. Tomt = ikke dokumenteret → ψ<sub>re,V</sub> = 1,0.",ref:"EN 1992-4, 7.2.2.5"},{k:"beton.armering.kantarmeringDiameter",hl:"arm.kant",sym:"⌀",lbl:"Kantstang ⌀",unit:"mm",type:"num",min:0,nullable:!0,show:t=>t.beton.revnet&&t.beton.armering.kantarmering==="boejler",tip:"Diameter af kantstangen. ψ<sub>re,V</sub> = 1,4 kræver ⌀ ≥ 12 mm. Tomt = ikke dokumenteret → ψ<sub>re,V</sub> = 1,0.",ref:"EN 1992-4, 7.2.2.5"},{k:"beton.armering.kantarmeringBredde",hl:"arm.kant",sym:"b<sub>s</sub>",lbl:"Kantbøjlens ben ind i elementet",unit:"mm",type:"num",min:20,max:1e3,show:t=>t.beton.revnet&&t.beton.armering.kantarmering==="boejler",tip:"Kantbøjlens udstrækning vinkelret ind fra kanten (kun tegning; indgår ikke i beregningen). Bøjlen tegnes som en åben hårnål med bøjningen (dorn efter EN 1992-1-1) ved kanten om to kantstænger med samme diameter ⌀ som kantstangen; benene går vandret ind i elementet.",ref:"EN 1992-4, 7.2.2.5 / EN 1992-1-1, 8.3"},{k:"beton.armering.splitArmering",hl:"arm.split",sym:"",lbl:"Revnebegrænsende armering (spaltning)",type:"switch",tip:"Armering der begrænser revnevidden til w<sub>k</sub> ≤ 0,3 mm – spaltning kan da udelades i revnet beton.",ref:"EN 1992-4, 7.2.1.7 (2) b"},{sub:"Ankerarmering for træk"},{k:"beton.armering.ankerarmeringTraek.aktiv",hl:"arm.T",sym:"",lbl:"Ankerarmering for t d/2 + ⌀/2 (boltens og stangens radius) giver en bøjle gennem skaftet og advares også.",ref:"EN 1992-4, 7.2.1.2(2)c"},{k:"beton.armering.ankerarmeringTraek.vinkel",hl:"arm.T.vinkel",sym:"θ",lbl:"Drejning af bøjleparrene",unit:"°",type:"num",min:0,max:90,show:St,tip:"Frit valgt drejning af bøjleparrene om ankeret (kun tegning; beregningen er uafhængig af retningen, da benene ligger symmetrisk om ankeret). Tomt: efter kontakten 'Drej bøjleparrene 90°'.",ref:"EN 1992-4, Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.daeklagTop",hl:"arm.T.top",sym:"c<sub>top</sub>",lbl:"Dæklag til benets top",unit:"mm",type:"num",min:0,show:St,tip:"Afstand fra betonoverflade til benets øverste forankringspunkt. Bestemmer l<sub>1</sub> i brudkeglen.",ref:"EN 1992-4, (7.33), Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.krog",hl:"arm.T.krog",sym:"",lbl:"Bøjle med bøjning ved overfladen (ellers lige stænger)",type:"switch",show:St,tip:"Til: bøjle med den lukkede ende ved den belastede overflade om overfladearmeringen – l<sub>1</sub> ≥ 4⌀. Fra: rette, lodrette stænger parvis om ankeret med lige ender i keglen – l<sub>1</sub> ≥ 10⌀; ingen overfladestænger tegnes, da stængerne ikke omslutter dem.",ref:"EN 1992-4, 7.2.1.2(2)d"},{k:"beton.armering.ankerarmeringTraek.cd",hl:"arm.T.cd",sym:"c<sub>d</sub>",lbl:"c<sub>d</sub> for α<sub>1</sub>",unit:"mm",type:"num",min:0,nullable:!0,std:()=>"α₁ = 1,0",show:t=>St()&&t.beton.armering.ankerarmeringTraek.krog,tip:"Mindste af sidedæklag og halv fri afstand til nabostang, vinkelret på bøjningens plan (EN 1992-1-1, Fig. 8.3). α<sub>1</sub> = 0,7 når c<sub>d</sub> > 3⌀. Tomt: α<sub>1</sub> = 1,0 (på den sikre side).",ref:"EN 1992-1-1, 8.4.4"},{k:"beton.armering.ankerarmeringTraek.foering",hl:"arm.T.foering",sym:"",lbl:"Trækket føres videre",type:"select",options:[["stoed","Ved stød i elementets armering"],["ingen","Nej – kegle ved armeringens ende"]],show:St,tip:"Ankerarmeringen skal forankres uden for keglen. Føres trækket ikke over i elementets armering med et stød, skal betonkeglebrud ved armeringens ende eftervises (7.2.1.2(2)e).",ref:"EN 1992-4, 7.2.1.2 (2) e"},{k:"beton.armering.ankerarmeringTraek.forankringsdybde",hl:"arm.T.dybde",sym:"h'<sub>ef,re</sub>",lbl:"Armeringens forankringsdybde",unit:"mm",type:"num",minEx:0,nullable:!0,std:t=>Pn(t.anker.hef),show:t=>St()&&t.beton.armering.ankerarmeringTraek.foering==="ingen",tip:"Dybde til armeringens ende/bøjning. Bruges til betonkeglebrud ved armeringens ende (N<sub>cre</sub>) og i 3D. Tomt = ankerets h<sub>ef</sub> (konservativt for N<sub>cre</sub>). Programmet advarer, hvis benene derved forankres mindre end l<sub>bd</sub> uden for brudkeglen (EN 1992-1-1, 8.4.4), og oplyser den nødvendige dybde.",ref:"EN 1992-4, 7.2.1.2 (2) e / (7.1)"},{k:"beton.armering.ankerarmeringTraek.eta1",hl:"arm.T.eta1",sym:"η<sub>1</sub>",lbl:"Vedhæftningsforhold",type:"select",num:!0,options:[[1,"Gode (1,0)"],[.7,"Andre (0,7)"]],show:St,tip:"η<sub>1</sub> i f<sub>bd</sub>.",ref:"EN 1992-1-1, 8.4.2"},{k:"beton.armering.ankerarmeringTraek.drejet",hl:"arm.T.drejet",sym:"",lbl:"Drej bøjleparrene 90°",type:"switch",show:St,tip:"Bøjleparrenes plan ligger som standard langs x; slået til drejes de 90° om ankeret (langs y). Påvirker kun tegningen – beregningen er uafhængig af retningen, da benene ligger symmetrisk om ankeret.",ref:"EN 1992-4, Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.fladeDiameter",hl:"arm.T.flade",sym:"⌀<sub>s</sub>",lbl:"Overfladearmering: diameter",unit:"mm",type:"num",min:4,max:40,show:St,tip:"Diameter af den overfladearmering, som bøjlerne omslutter (tegnes som stænger). Påvirker kun tegningen – kontrollen af overfladearmeringen foretages ikke af programmet.",ref:"EN 1992-4, 7.2.1.2 / Fig. 7.2"},{k:"beton.armering.ankerarmeringTraek.fladeAfstand",hl:"arm.T.flade",sym:"s<sub>s</sub>",lbl:"Overfladearmering: afstand",unit:"mm",type:"num",min:20,max:500,show:St,tip:"C/c-afstand mellem overfladestængerne (begge retninger), med en stang gennem hver bøjle. Påvirker kun tegningen.",ref:""},{sub:"Forudsætninger for ankerarmering i træk (7.2.1.2(2))",show:St},{k:"beton.armering.ankerarmeringTraek.bekraeft.a",hl:"arm.T.bekr.a",sym:"a",lbl:"a) Ribbestål som bøjler/løkker er kontrolleret",type:"switch",show:St,tip:"Programmet kontrollerer ⌀ ≤ 16 mm og f<sub>yk,re</sub> ≤ 600 MPa. Bekræft her, at armeringen er ribbestål udformet som bøjler eller løkker, og at de øvrige krav i a) er opfyldt (se normteksten).",ref:"EN 1992-4, 7.2.1.2(2)a"},{k:"beton.armering.ankerarmeringTraek.bekraeft.e",hl:"arm.T.bekr.e",sym:"e",lbl:"e) Trækket føres videre med stød i elementets armering",type:"switch",show:t=>St()&&t.beton.armering.ankerarmeringTraek.foering==="stoed",tip:'Gælder, når trækket føres videre ved et stød: bekræft, at ankerarmeringen er forankret/stødt uden for brudkeglen i elementets armering. Vælges i stedet "Nej – kegle ved armeringens ende", eftervises betonkeglen ved armeringens ende af programmet, og feltet er unødvendigt.',ref:"EN 1992-4, 7.2.1.2(2)e"},{k:"beton.armering.ankerarmeringTraek.bekraeft.f",hl:"arm.T.bekr.f",sym:"f",lbl:"f) Betingelse f) er kontrolleret",type:"switch",show:St,tip:"Programmet kender ikke ordlyden af betingelse f) (normteksten ligger ikke i kodelageret). Slå op i EN 1992-4, 7.2.1.2(2)f og bekræft her, når den er opfyldt. Bekræftelsen noteres i rapportens bemærkninger.",ref:"EN 1992-4, 7.2.1.2(2)f"},{custom:"armsum",which:"T",show:St},{sub:"Ankerarmering for forskydning"},{k:"beton.armering.ankerarmeringForskydning.aktiv",hl:"arm.V",sym:"",lbl:"Ankerarmering for forskydning",type:"switch",tip:"Armering der optager hele forskydningskraften og erstatter betonkantbrud mod den valgte kant (7.2.2.2(1)). Skal forankres uden for brudlegemet med l<sub>bd</sub> efter EN 1992-1-1 (7.2.2.2(2)) – det eftervises ikke af programmet.",ref:"EN 1992-4, 7.2.2.6"},{k:"beton.armering.ankerarmeringForskydning.kant",hl:"arm.V.kant",sym:"",lbl:"Kant der armeres",type:"select",nullable:!0,options:[["","Styrende kant"],["xNeg","Kan .build{color:var(--ink3);font-size:8.5pt;text-align:right;white-space:nowrap}
h2{font-size:12.5pt;margin:20pt 0 6pt;padding-bottom:2pt;border-bottom:1px solid var(--ink);font-weight:650;break-after:avoid}
h3{font-size:10.5pt;margin:12pt 0 3pt;font-weight:650;break-after:avoid}
h3.fl{display:flex;justify-content:space-between;align-items:baseline;gap:10pt}
h3 .u{font-variant-numeric:tabular-nums}
h3 small{font-weight:400;color:var(--ink3);font-size:8.5pt}
table{border-collapse:collapse;width:100%;margin:3pt 0 6pt;font-size:9pt}
th,td{padding:2.2pt 5pt;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink3);border-bottom:1px solid var(--rule)}
thead th{font-size:8.5pt}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr{break-inside:avoid}
.meta{width:100%;margin:8pt 0 0;table-layout:fixed}.meta th{width:17%;white-space:nowrap}.meta td{width:33%}
.urgent{font-weight:700}
.dom{display:flex;gap:10pt;align-items:center;margin:10pt 0 4pt;padding:8pt 11pt;border-radius:4pt;border-left:5pt solid}
.dom.ok{background:var(--okbg);border-color:var(--ok)}.dom.bad{background:var(--badbg);border-color:var(--bad)}
.dom .stor{font-size:15pt;font-weight:750;letter-spacing:.02em;white-space:nowrap}.dom.ok .stor{color:var(--ok)}.dom.bad .stor{color:var(--bad)}
.dom .tekst{flex:1}.dom .tekst b{font-weight:650}

.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.na{color:var(--ink3)}
.mx td.n{font-weight:600}.mx td.ok,.mx td.warn,.mx td.bad{font-weight:650}
.mx tr.tot td{border-top:1.5px solid var(--ink);font-weight:700}
.mx th.gov{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.mx td.mxv{background:var(--rule2)}
.bar{display:inline-block;width:46pt;height:5pt;border-radius:3pt;background:var(--rule2);vertical-align:middle;margin-left:5pt;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3pt}.bar.ok i{background:#3a9a5c}.bar.warn i{background:#d79a1d}.bar.bad i{background:#d0453a}
.bar:after{content:"";position:absolute;left:80%;top:0;bottom:0;width:.6pt;background:var(--ink3)}
tr.styrende td{font-weight:650}tr.styrende td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.ikke td{color:var(--ink3)}
.kref{color:var(--ink3);font-size:8pt;white-space:nowrap}
code,.id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5pt;color:var(--ink2)}
.inddata td:first-child{width:11%}.inddata td.t{font-weight:600;text-align:right;white-space:nowrap}.inddata td:nth-child(4){color:var(--ink3);width:8%}.inddata td.ref{color:var(--ink3);font-size:8pt;width:24%}
.fig{display:flex;gap:6mm;align-items:flex-start;margin:6pt 0;break-inside:avoid}
.fig figure{margin:0;flex:1;min-width:0}
.fig svg,.smaa svg{width:100%;height:auto;color:var(--ink);--card:#fff;--accent:#1b5fd0;--warn:#c98a00;--err:#c62d20;--ink:#14202a;--ink-2:#4a5863;--ink-3:#7b8791;--rule:#d5dbe0}
figcaption{color:var(--ink3);font-size:8.5pt;margin-top:2pt}
.smaa{display:grid;grid-template-columns:repeat(2,1fr);gap:5mm;margin-top:4pt}.smaa figure{margin:0;break-inside:avoid}
.st td:nth-child(1){width:34%;color:var(--ink2)}.st td:nth-child(3){text-align:right;font-weight:600}
.st .f{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:9.5pt}
.ligning{margin:2pt 0 8pt;break-inside:auto}.ligning .noter{color:var(--ink3);font-size:8.5pt;margin:0 0 4pt}
.forb h4{margin:8pt 0 2pt;font-size:9.5pt}.forb ul,ul.dok{margin:0;padding-left:16pt}.forb li,ul.dok li{margin:1.5pt 0}
li.fejl{color:var(--bad)}li.advarsel{color:var(--warn)}li.info{color:var(--ink)}
.toc{margin:12pt 0 0;padding:6pt 10pt;border:1px solid var(--rule);border-radius:4pt;font-size:9pt;break-inside:avoid}
.toc h2.tochead{font-size:10.5pt;margin:0 0 3pt;border:0}.toc ol{margin:0;padding-left:16pt}.toc ul{margin:1pt 0 3pt;padding-left:14pt;list-style:none}.toc li{margin:1pt 0}

a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a.lnk{color:inherit}a.lnk:hover{color:var(--accent);text-decoration:underline}
h2 .op,.vaerktoej+.side .op{float:right;font-size:8pt;font-weight:400}
h2,h3,tr,.ligning{scroll-margin-top:12px}
html{scroll-behavior:smooth}
.under{margin-top:18pt;padding-top:5pt;border-top:1px solid var(--rule);color:var(--ink3);font-size:8pt;display:flex;justify-content:space-between}
