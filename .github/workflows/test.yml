name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Uafhængig reference (Python) er uændret
        run: |
          python3 verifikation/reference.py > /dev/null
          git diff --exit-code verifikation/expected.json
